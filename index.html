<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Questbook — gamified study planner</title>
  <meta name="description" content="Plan classes, schedules, assignments and key dates, track study time, keep notes, and prep for tests with study games. Free, private, no account needed.">
  <meta name="theme-color" content="#0d7a68">

  <!-- Install as an app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Questbook">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Questbook — your school year, played like a game">
  <meta property="og:description" content="Classes, schedules, assignments, study timer, notes and study games in one free app. No account needed.">
  <meta property="og:image" content="icons/social.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/views.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">Questbook needs JavaScript to run. Please enable it and reload.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
